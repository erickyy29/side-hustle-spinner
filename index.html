<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Side Hustle Spinner</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;800&display=block" rel="stylesheet">
<style>
  :root {
    --bg: #0a0a0a;
    --red: #ff2a2a;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    width: 100%; height: 100%;
    overflow: hidden;
    background: var(--bg);
    cursor: none;
    font-family: "Montserrat", system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
    user-select: none;
  }
  body.green { --bg: #00ff00; }

  /* Deep-red glow bleeding in from the edges and corners */
  #glow {
    position: fixed; inset: 0; pointer-events: none;
    background:
      radial-gradient(ellipse 55% 45% at 0% 0%,   rgba(150, 0, 8, .55), transparent 70%),
      radial-gradient(ellipse 55% 45% at 100% 0%, rgba(150, 0, 8, .55), transparent 70%),
      radial-gradient(ellipse 55% 45% at 0% 100%, rgba(150, 0, 8, .55), transparent 70%),
      radial-gradient(ellipse 55% 45% at 100% 100%, rgba(150, 0, 8, .55), transparent 70%);
    box-shadow: inset 0 0 14vmax rgba(120, 0, 6, .55), inset 0 0 4vmax rgba(60, 0, 0, .6);
    animation: breathe 6s ease-in-out infinite;
  }
  @keyframes breathe { 50% { opacity: .8; } }
  body.green #glow { display: none; }

  /* Fades the drum out at the top and bottom */
  #mask {
    position: fixed; inset: 0;
    -webkit-mask-image: linear-gradient(to bottom, transparent 4%, #000 30%, #000 70%, transparent 96%);
            mask-image: linear-gradient(to bottom, transparent 4%, #000 30%, #000 70%, transparent 96%);
  }
  #reel {
    position: absolute; inset: 0;
    will-change: filter;
  }
  .row {
    position: absolute; left: 50%; top: 50%;
    white-space: nowrap;
    color: #fff;
    font-weight: 800;
    text-transform: uppercase;
    letter-spacing: .06em;
    line-height: 1;
    will-change: transform, opacity;
    backface-visibility: hidden;
  }
  .row.win {
    text-shadow:
      0 0 .12em rgba(255, 255, 255, .85),
      0 0 .45em rgba(255, 255, 255, .45),
      0 0 1.1em rgba(255, 42, 42, .55);
  }
  body.green .row.win {
    text-shadow: 0 0 .12em rgba(255, 255, 255, .6);
  }

  #confetti {
    position: fixed; inset: 0; width: 100%; height: 100%;
    pointer-events: none; z-index: 5;
  }
  #pill {
    position: fixed; left: 50%; top: 50%;
    padding: .55em 1.5em .6em;
    border-radius: 999px;
    background: var(--red);
    color: #fff;
    font-weight: 800;
    letter-spacing: .16em;
    text-transform: uppercase;
    white-space: nowrap;
    box-shadow: 0 0 .9em rgba(255, 42, 42, .8), 0 0 2.6em rgba(255, 42, 42, .45);
    opacity: 0;
    transform: translate(-50%, 0) scale(.85);
    transition: opacity .45s ease, transform .55s cubic-bezier(.2, 1.4, .4, 1);
    pointer-events: none;
  }
  #pill.show { opacity: 1; transform: translate(-50%, 0) scale(1); }

  /* Settings panel (E) */
  #settings {
    position: fixed; inset: 0;
    display: none; align-items: center; justify-content: center;
    padding: 16px;
    background: rgba(0, 0, 0, .72);
    backdrop-filter: blur(6px);
    cursor: auto;
    z-index: 20;
  }
  #settings.open { display: flex; }
  #settings .panel {
    width: min(600px, 100%);
    max-height: calc(100vh - 32px);
    display: flex; flex-direction: column;
    background: #121212;
    border: 1px solid #262626;
    border-radius: 18px;
    box-shadow: 0 30px 80px rgba(0, 0, 0, .6), 0 0 0 1px rgba(255, 42, 42, .06);
    color: #ddd;
    font: 600 13px/1.4 "Montserrat", system-ui, sans-serif;
    user-select: text;
    overflow: hidden;
  }
  #settings header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 18px 20px 14px;
    border-bottom: 1px solid #1f1f1f;
  }
  #settings h2 { font-size: 15px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; color: #fff; }
  #settings .sub { color: #777; font-size: 11px; font-weight: 600; margin-top: 2px; letter-spacing: 0; text-transform: none; }
  #settings .body { padding: 14px 20px; overflow-y: auto; }
  #settings section + section { margin-top: 18px; }
  #settings h3 { font-size: 11px; font-weight: 800; letter-spacing: .12em; text-transform: uppercase; color: #888; margin-bottom: 8px; }
  #settings .cols, #settings .item {
    display: grid; grid-template-columns: 22px 1fr 84px 52px 30px; gap: 8px; align-items: center;
  }
  #settings .cols { color: #666; font-size: 10px; font-weight: 800; letter-spacing: .1em; text-transform: uppercase; padding: 0 2px 6px; }
  #settings .item { padding: 4px 2px; border-radius: 10px; }
  #settings .item:hover { background: #181818; }
  #settings .num { color: #555; font-size: 11px; text-align: right; }
  #settings input[type=text], #settings input[type=number] {
    width: 100%; min-width: 0;
    background: #0b0b0b; color: #fff;
    border: 1px solid #2c2c2c; border-radius: 8px;
    padding: 8px 10px;
    font: 800 13px "Montserrat", system-ui, sans-serif;
    letter-spacing: .04em;
    outline: none;
  }
  #settings input[type=text] { text-transform: uppercase; }
  #settings input:focus { border-color: var(--red); box-shadow: 0 0 0 3px rgba(255, 42, 42, .18); }
  #settings .pct { position: relative; }
  #settings .pct input { padding-right: 22px; text-align: right; }
  #settings .pct::after { content: "%"; position: absolute; right: 9px; top: 50%; transform: translateY(-50%); color: #666; font-size: 12px; }
  #settings .chance { font-size: 11px; color: #999; text-align: right; font-variant-numeric: tabular-nums; }
  #settings .chance.hot { color: var(--red); }
  #settings .chance.zero { color: #444; }
  #settings button {
    font: 800 11px "Montserrat", sans-serif; letter-spacing: .08em; text-transform: uppercase;
    padding: 9px 14px; border-radius: 999px; border: 0; cursor: pointer;
    background: #232323; color: #ccc;
    transition: background .15s, color .15s;
  }
  #settings button:hover { background: #2e2e2e; color: #fff; }
  #settings button.primary { background: var(--red); color: #fff; box-shadow: 0 0 18px rgba(255, 42, 42, .35); }
  #settings button.primary:hover { background: #ff4545; }
  #settings button.icon { padding: 0; width: 30px; height: 30px; font-size: 15px; letter-spacing: 0; }
  #settings .tools { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-top: 10px; }
  #settings button.del { background: transparent; color: #555; }
  #settings button.del:hover { background: rgba(255, 42, 42, .14); color: var(--red); }
  #settings footer {
    display: flex; gap: 8px; align-items: center; justify-content: flex-end;
    padding: 14px 20px;
    border-top: 1px solid #1f1f1f;
  }
  #settings footer .spacer { margin-right: auto; }

  #measure {
    position: absolute; visibility: hidden; white-space: nowrap;
    font-weight: 800; letter-spacing: .06em; text-transform: uppercase; line-height: 1;
  }
</style>
</head>
<body>
<script>
  // ── The list. Edit here, or press E on screen. ──────────────────────────
  const ITEMS = [
    "NEWSLETTER",
    "DROPSHIPPING",
    "YT KIDS CHANNEL",
    "META ADS",
    "PRINT ON DEMAND",
    "UGC CREATOR",
    "FACELESS TIKTOK",
    "AI INFLUENCER",
    "VENDING MACHINES",
  ];
  const PILL_TEXT = "YOUR SIDE HUSTLE";
</script>

<div id="glow"></div>
<div id="mask"><div id="reel"></div></div>
<div id="pill"></div>
<canvas id="confetti"></canvas>
<span id="measure"></span>

<svg width="0" height="0" style="position:absolute">
  <filter id="mblur" x="-5%" y="-40%" width="110%" height="180%" color-interpolation-filters="sRGB">
    <feGaussianBlur id="mblurStd" stdDeviation="0 0" />
  </filter>
</svg>

<div id="settings" role="dialog" aria-label="Settings">
  <div class="panel">
    <header>
      <div>
        <h2>Settings</h2>
        <div class="sub">Edit the names and the odds of landing on each one.</div>
      </div>
      <button class="icon" id="setClose" title="Close (Esc)">✕</button>
    </header>
    <div class="body">
      <section>
        <h3>Spinner items</h3>
        <div class="cols"><span></span><span>Name</span><span>Odds</span><span>Chance</span><span></span></div>
        <div id="setItems"></div>
        <div class="tools">
          <button id="setAdd">+ Add item</button>
        </div>
      </section>
    </div>
    <footer>
      <span class="spacer"></span>
      <button id="setCancel">Cancel</button>
      <button class="primary" id="setSave">Save</button>
    </footer>
  </div>
</div>

<script>
(() => {
  // ── Tuning ────────────────────────────────────────────────────────────────
  const SPIN_MS = 3100;      // main spin duration (+ bounce ≈ 3.5s total)
  const MIN_ROWS = 26;       // minimum items travelled per spin
  const CRUISE = 0.2;        // fraction of the spin at full speed (after ramp)
  const RAMP = 0.06;         // fraction of the spin spent ramping up
  const OVERSHOOT = 0.16;    // rows past the winner before bouncing back
  const BOUNCE_MS = 420;
  const DRUM_STEP = 21;      // degrees between rows on the drum
  const SLOTS = 4;           // rows rendered above/below center

  const STORE_KEY = "side-hustle-spinner:settings";
  const LEGACY_KEY = "side-hustle-reel:list";

  // ── State ─────────────────────────────────────────────────────────────────
  let items = loadItems();   // [{ name, weight }] — weight is a % chance
  let pos = 0;               // continuous reel position, in rows
  let mode = "idle";         // idle | spin | bounce | landed
  let spin = null;           // { start, p0, dist }
  let bounceStart = 0;
  let landT = 0;             // 0→1 landing emphasis
  let lastResult = -1;
  let preset = -1;
  let soundOn = true;
  let lastCenter = 0;
  let prevPos = 0, prevTime = performance.now();

  const reel = document.getElementById("reel");
  const pill = document.getElementById("pill");
  const blurStd = document.getElementById("mblurStd");
  const measure = document.getElementById("measure");
  const settings = document.getElementById("settings");
  const setItems = document.getElementById("setItems");
  pill.textContent = PILL_TEXT;

  // ── Layout ────────────────────────────────────────────────────────────────
  let fontPx = 0, rowH = 0, drumR = 0;
  let fit = [];              // per-item scale so long names fit the width

  const rows = [];
  for (let k = -SLOTS; k <= SLOTS; k++) {
    const el = document.createElement("div");
    el.className = "row";
    reel.appendChild(el);
    rows.push({ el, k, text: null });
  }

  function layout() {
    const w = innerWidth, h = innerHeight;
    fontPx = Math.min(w * (h > w ? 0.105 : 0.08), h * 0.11);  // a bit bigger in 9:16
    rowH = fontPx * 1.32;
    drumR = rowH / Math.sin(DRUM_STEP * Math.PI / 180);
    reel.style.perspective = (drumR * 3.2) + "px";
    for (const r of rows) r.el.style.fontSize = fontPx + "px";

    measure.style.fontSize = fontPx + "px";
    const maxW = w * 0.9;
    fit = items.map(it => {
      measure.textContent = it.name;
      return Math.min(1, maxW / measure.getBoundingClientRect().width);
    });

    pill.style.fontSize = Math.max(11, fontPx * 0.24) + "px";
    pill.style.marginTop = (fontPx * 0.78) + "px";
    for (const r of rows) r.text = null;
  }

  const mod = (a, n) => ((a % n) + n) % n;

  // ── Spin curve: fast ramp, short cruise, long cubic ease-out (the crawl) ──
  const CURVE_N = 2000;
  const curve = new Float32Array(CURVE_N + 1);
  (function buildCurve() {
    let acc = 0;
    curve[0] = 0;
    for (let i = 1; i <= CURVE_N; i++) {
      const u = (i - 0.5) / CURVE_N;
      const r = Math.min(1, u / RAMP);
      const ramp = r * r * (3 - 2 * r);
      const decay = u < RAMP + CRUISE ? 1 : Math.pow((1 - u) / (1 - RAMP - CRUISE), 3);
      acc += ramp * decay;
      curve[i] = acc;
    }
    for (let i = 0; i <= CURVE_N; i++) curve[i] /= acc;
  })();
  function curveAt(u) {
    if (u >= 1) return 1;
    const x = u * CURVE_N, i = Math.floor(x);
    return curve[i] + (curve[i + 1] - curve[i]) * (x - i);
  }

  // ── Spin control ──────────────────────────────────────────────────────────
  function pickTarget() {
    const n = items.length;
    if (preset >= 0 && preset < n) { const t = preset; preset = -1; return t; }
    preset = -1;
    if (n === 1) return 0;

    const weights = items.map(it => Math.max(0, Number(it.weight) || 0));
    const total = weights.reduce((a, b) => a + b, 0);
    if (total <= 0) return Math.floor(Math.random() * n);    // all zero → plain random

    // Equal odds: truly random but never the same result twice in a row.
    // Custom odds: honour them exactly (100% must always win).
    const equal = weights.every(w => Math.abs(w - weights[0]) < 0.01);
    if (equal && lastResult >= 0 && lastResult < n) weights[lastResult] = 0;

    const sum = weights.reduce((a, b) => a + b, 0);
    let r = Math.random() * sum;
    for (let i = 0; i < n; i++) {
      r -= weights[i];
      if (r < 0) return i;
    }
    return weights.findLastIndex(w => w > 0);
  }

  function startSpin() {
    if (mode === "spin" || mode === "bounce" || !items.length) return;
    ensureAudio();
    const n = items.length;
    const p0 = Math.round(pos);
    const target = pickTarget();
    const dist = MIN_ROWS + mod(target - (p0 + MIN_ROWS), n);
    spin = { start: performance.now(), p0, dist, target };
    pos = p0;
    lastCenter = p0;
    mode = "spin";
    landT = 0;
    pill.classList.remove("show");
    confetti.length = 0;
  }

  function reset() {
    mode = "idle";
    spin = null;
    pos = 0;
    lastCenter = 0;
    landT = 0;
    pill.classList.remove("show");
    confetti.length = 0;
  }

  // ── Render ────────────────────────────────────────────────────────────────
  function render(now) {
    const dt = Math.max(1, now - prevTime);
    const speed = Math.abs(pos - prevPos) / dt * 1000; // rows / second
    prevPos = pos; prevTime = now;

    const n = items.length;
    if (!n) { for (const r of rows) r.el.textContent = ""; return; }

    const base = Math.floor(pos);
    const frac = pos - base;
    const centerIdx = Math.round(pos);

    for (const r of rows) {
      const idx = base + r.k;
      const d = r.k - frac;            // distance from center, in rows
      const ad = Math.abs(d);
      const item = mod(idx, n);
      const text = items[item].name;
      if (r.text !== text) { r.el.textContent = text; r.text = text; }

      const theta = d * DRUM_STEP;
      if (Math.abs(theta) > 86) { r.el.style.opacity = 0; continue; }
      const rad = theta * Math.PI / 180;
      const gap = fontPx * 0.42 * Math.sign(d) * Math.min(ad, 1);  // breathing room around the big center row
      const y = drumR * Math.sin(rad) + gap;
      const z = drumR * (Math.cos(rad) - 1);
      const s = (1 - 0.42 * Math.min(ad, 1)) * fit[item];

      let o = ad <= 1 ? 1 - 0.7 * ad : 0.3 * Math.max(0, 1 - (ad - 1) / 2.6);
      if (idx !== centerIdx) o *= 1 - 0.75 * landT;   // dim neighbours on landing

      r.el.style.opacity = o.toFixed(3);
      r.el.style.transform =
        `translate(-50%,-50%) translate3d(0,${y.toFixed(2)}px,${z.toFixed(2)}px) rotateX(${(-theta).toFixed(2)}deg) scale(${s.toFixed(4)})`;
      r.el.classList.toggle("win", mode === "landed" || mode === "bounce" ? idx === centerIdx : false);
    }

    // Vertical-only motion blur scaled to speed
    const pxPerFrame = speed * rowH / 60;
    const blur = Math.min(26, pxPerFrame * 0.32);
    if (blur > 0.15) {
      blurStd.setAttribute("stdDeviation", `0 ${blur.toFixed(2)}`);
      reel.style.filter = "url(#mblur)";
    } else {
      reel.style.filter = "none";
    }
  }

  function frame(now) {
    if (mode === "spin") {
      const u = (now - spin.start) / SPIN_MS;
      pos = spin.p0 + (spin.dist + OVERSHOOT) * curveAt(u);
      if (u >= 1) {
        mode = "bounce";
        bounceStart = now;
        playHit();
      }
    } else if (mode === "bounce") {
      const v = Math.min(1, (now - bounceStart) / BOUNCE_MS);
      const e = v < 0.5 ? 4 * v * v * v : 1 - Math.pow(-2 * v + 2, 3) / 2;
      pos = spin.p0 + spin.dist + OVERSHOOT * (1 - e);
      if (v >= 1) {
        const n = items.length;
        pos = mod(spin.p0 + spin.dist, n);   // keep numbers small
        prevPos = pos;
        lastCenter = pos;
        lastResult = spin.target;
        mode = "landed";
        pill.classList.add("show");
        burstConfetti();
      }
    }

    if (mode === "bounce" || mode === "landed") landT = Math.min(1, landT + 0.06);

    // Tick when an item crosses the center line
    if (mode === "spin") {
      const c = Math.round(pos);
      if (c !== lastCenter) { lastCenter = c; playTick(); }
    }

    render(now);
    drawConfetti(now);
    requestAnimationFrame(frame);
  }

  // ── Confetti ──────────────────────────────────────────────────────────────
  const cv = document.getElementById("confetti");
  const cx = cv.getContext("2d");
  const confetti = [];
  const CONFETTI_COLORS = ["#ff2a2a", "#ffffff", "#ff6b6b", "#ffb3b3", "#ffd23f", "#b30000"];
  let lastConfettiAt = 0;

  function sizeCanvas() {
    const dpr = Math.min(2, devicePixelRatio || 1);
    cv.width = innerWidth * dpr; cv.height = innerHeight * dpr;
    cx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }

  function addPiece(x, y, angle, speed) {
    const sz = Math.max(6, fontPx * 0.11) * (0.7 + Math.random() * 0.7);
    confetti.push({
      x, y,
      vx: Math.cos(angle) * speed, vy: Math.sin(angle) * speed,
      w: sz, h: sz * (0.4 + Math.random() * 0.4),
      rot: Math.random() * Math.PI * 2, vr: (Math.random() - 0.5) * 14,
      flip: Math.random() * Math.PI * 2, vf: 6 + Math.random() * 10,
      sway: Math.random() * Math.PI * 2,
      color: CONFETTI_COLORS[Math.floor(Math.random() * CONFETTI_COLORS.length)],
      round: Math.random() < 0.25,
    });
  }

  function burstConfetti() {
    const w = innerWidth, h = innerHeight;
    const unit = Math.min(w, h);
    // Pop from behind the winner
    for (let i = 0; i < 140; i++) {
      const a = -Math.PI / 2 + (Math.random() - 0.5) * Math.PI * 1.5;
      addPiece(w / 2 + (Math.random() - 0.5) * w * 0.3, h / 2, a, unit * (0.9 + Math.random() * 1.5));
    }
    // Cannons from the bottom corners
    for (let i = 0; i < 90; i++) {
      addPiece(0, h, -Math.PI / 3 + (Math.random() - 0.5) * 0.5, unit * (1.6 + Math.random() * 1.3));
      addPiece(w, h, -Math.PI * 2 / 3 + (Math.random() - 0.5) * 0.5, unit * (1.6 + Math.random() * 1.3));
    }
  }

  function drawConfetti(now) {
    const dt = Math.min(0.05, (now - (lastConfettiAt || now)) / 1000);
    lastConfettiAt = now;
    if (!confetti.length) { if (cv.dataset.dirty) { cx.clearRect(0, 0, innerWidth, innerHeight); delete cv.dataset.dirty; } return; }
    cv.dataset.dirty = 1;
    cx.clearRect(0, 0, innerWidth, innerHeight);
    const g = Math.min(innerWidth, innerHeight) * 1.15;
    for (let i = confetti.length - 1; i >= 0; i--) {
      const p = confetti[i];
      p.vy += g * dt;
      const drag = Math.pow(0.18, dt);            // air resistance
      p.vx *= drag; p.vy *= drag;
      p.sway += dt * 5;
      p.x += (p.vx + Math.sin(p.sway) * 40) * dt;
      p.y += p.vy * dt;
      p.rot += p.vr * dt;
      p.flip += p.vf * dt;
      if (p.y > innerHeight + 40) { confetti.splice(i, 1); continue; }
      cx.save();
      cx.translate(p.x, p.y);
      cx.rotate(p.rot);
      cx.scale(1, Math.cos(p.flip));               // 3D tumble
      cx.fillStyle = p.color;
      if (p.round) { cx.beginPath(); cx.arc(0, 0, p.h * 0.6, 0, Math.PI * 2); cx.fill(); }
      else cx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h);
      cx.restore();
    }
  }

  // ── Audio (Web Audio, no files) ───────────────────────────────────────────
  let ac = null, master = null, noiseBuf = null, lastTickAt = 0;

  function ensureAudio() {
    if (ac) { if (ac.state === "suspended") ac.resume(); return; }
    ac = new (window.AudioContext || window.webkitAudioContext)();
    const comp = ac.createDynamicsCompressor();
    comp.threshold.value = -14; comp.ratio.value = 4;
    master = ac.createGain();
    master.gain.value = 0.9;
    master.connect(comp).connect(ac.destination);
    noiseBuf = ac.createBuffer(1, ac.sampleRate * 0.5, ac.sampleRate);
    const d = noiseBuf.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
  }

  function noise(t, dur, type, freq, q, gain) {
    const src = ac.createBufferSource();
    src.buffer = noiseBuf;
    const f = ac.createBiquadFilter();
    f.type = type; f.frequency.value = freq; f.Q.value = q;
    const g = ac.createGain();
    g.gain.setValueAtTime(gain, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    src.connect(f).connect(g).connect(master);
    src.start(t); src.stop(t + dur + 0.02);
  }

  function tone(t, type, f0, f1, dur, gain, attack = 0.002) {
    const o = ac.createOscillator();
    o.type = type;
    o.frequency.setValueAtTime(f0, t);
    if (f1 !== f0) o.frequency.exponentialRampToValueAtTime(f1, t + dur);
    const g = ac.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(gain, t + attack);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g).connect(master);
    o.start(t); o.stop(t + dur + 0.02);
  }

  function playTick() {
    if (!soundOn || !ac) return;
    const t = ac.currentTime;
    if (t - lastTickAt < 0.028) return;   // cap density at full speed
    lastTickAt = t;
    noise(t, 0.03, "bandpass", 3200, 1.8, 0.55);
    tone(t, "triangle", 1700, 1100, 0.035, 0.22, 0.001);
  }

  function playHit() {
    if (!soundOn || !ac) return;
    const t = ac.currentTime;
    tone(t, "sine", 160, 42, 0.45, 1.0, 0.003);          // body thump
    tone(t, "square", 95, 55, 0.12, 0.18, 0.002);         // grit
    noise(t, 0.18, "lowpass", 1800, 0.7, 0.7);            // impact
    noise(t, 0.06, "highpass", 5000, 0.7, 0.35);          // snap
    tone(t + 0.01, "sine", 1046, 1046, 0.9, 0.12, 0.004); // shine
    tone(t + 0.01, "sine", 1568, 1568, 0.7, 0.07, 0.004);
  }

  // ── Items ─────────────────────────────────────────────────────────────────
  function withEqualOdds(names) {
    const w = Math.round(1000 / names.length) / 10;
    return names.map(name => ({ name, weight: w }));
  }

  function loadItems() {
    try {
      const saved = JSON.parse(localStorage.getItem(STORE_KEY));
      if (saved && Array.isArray(saved.items) && saved.items.length) return saved.items;
      const legacy = JSON.parse(localStorage.getItem(LEGACY_KEY));   // old plain-string list
      if (Array.isArray(legacy) && legacy.length) return withEqualOdds(legacy);
    } catch (e) {}
    return withEqualOdds(ITEMS);
  }

  function saveItems() {
    try { localStorage.setItem(STORE_KEY, JSON.stringify({ items })); } catch (e) {}
  }

  // ── Settings panel ────────────────────────────────────────────────────────
  let draft = [];

  function chanceOf(i) {
    const total = draft.reduce((a, it) => a + Math.max(0, Number(it.weight) || 0), 0);
    if (total <= 0) return 100 / draft.length;
    return Math.max(0, Number(draft[i].weight) || 0) / total * 100;
  }

  function refreshChances() {
    setItems.querySelectorAll(".item").forEach((row, i) => {
      const c = chanceOf(i);
      const el = row.querySelector(".chance");
      el.textContent = (c >= 99.95 ? "100" : c.toFixed(c < 10 ? 1 : 0)) + "%";
      el.classList.toggle("hot", c >= 99.95);
      el.classList.toggle("zero", c === 0);
    });
  }

  function renderSettings() {
    setItems.innerHTML = "";
    draft.forEach((it, i) => {
      const row = document.createElement("div");
      row.className = "item";
      row.innerHTML = `
        <span class="num">${i + 1}</span>
        <input type="text" class="name" spellcheck="false" maxlength="40">
        <label class="pct"><input type="number" class="weight" min="0" max="100" step="1"></label>
        <span class="chance"></span>
        <button class="icon del" title="Remove">✕</button>`;
      const name = row.querySelector(".name");
      const weight = row.querySelector(".weight");
      name.value = it.name;
      weight.value = it.weight;
      name.addEventListener("input", () => { it.name = name.value; });
      weight.addEventListener("input", () => { it.weight = weight.value; refreshChances(); });
      row.querySelector(".del").addEventListener("click", () => {
        if (draft.length <= 1) return;
        const keepEqual = draftIsEqual();
        draft.splice(i, 1);
        if (keepEqual) equalizeDraft();
        renderSettings();
      });
      setItems.appendChild(row);
    });
    refreshChances();
  }

  function draftIsEqual() {
    return draft.every(it => Math.abs((Number(it.weight) || 0) - (Number(draft[0].weight) || 0)) < 0.01);
  }

  function equalizeDraft() {
    const w = Math.round(1000 / draft.length) / 10;
    draft.forEach(it => { it.weight = w; });
  }

  function addDraftItem() {
    const keepEqual = draftIsEqual();
    draft.push({ name: "", weight: 0 });
    if (keepEqual) equalizeDraft();
    renderSettings();
    const inputs = setItems.querySelectorAll(".name");
    inputs[inputs.length - 1].focus();
  }

  function openSettings() {
    draft = items.map(it => ({ ...it }));
    renderSettings();
    settings.classList.add("open");
  }

  function closeSettings() {
    settings.classList.remove("open");
  }

  function saveSettings() {
    const next = draft
      .map(it => ({
        name: String(it.name).trim().toUpperCase(),
        weight: Math.min(100, Math.max(0, Number(it.weight) || 0)),
      }))
      .filter(it => it.name);
    if (next.length) {
      items = next;
      saveItems();
      lastResult = -1;
      preset = -1;
      reset();
      layout();
    }
    closeSettings();
  }

  document.getElementById("setAdd").addEventListener("click", addDraftItem);
  document.getElementById("setSave").addEventListener("click", saveSettings);
  document.getElementById("setCancel").addEventListener("click", closeSettings);
  document.getElementById("setClose").addEventListener("click", closeSettings);
  settings.addEventListener("click", e => { e.stopPropagation(); if (e.target === settings) closeSettings(); });

  // ── Input ─────────────────────────────────────────────────────────────────
  addEventListener("keydown", e => {
    if (settings.classList.contains("open")) {
      if (e.key === "Escape") { e.preventDefault(); closeSettings(); }
      else if (e.key === "Enter" && (e.metaKey || e.ctrlKey)) { e.preventDefault(); saveSettings(); }
      return;
    }
    if (e.metaKey || e.ctrlKey || e.altKey) return;

    if (e.code === "Space") { e.preventDefault(); startSpin(); return; }
    if (/^Digit[1-9]$/.test(e.code) || /^Numpad[1-9]$/.test(e.code)) {
      const i = Number(e.code.slice(-1)) - 1;
      if (i < items.length) preset = i;     // silent: no visual feedback
      return;
    }
    switch (e.key.toLowerCase()) {
      case "r": reset(); break;
      case "f":
        if (document.fullscreenElement) document.exitFullscreen();
        else document.documentElement.requestFullscreen().catch(() => {});
        break;
      case "g": document.body.classList.toggle("green"); break;
      case "m": soundOn = !soundOn; break;
      case "e": e.preventDefault(); if (mode !== "spin" && mode !== "bounce") openSettings(); break;
    }
  });
  addEventListener("click", () => startSpin());
  addEventListener("resize", () => { layout(); sizeCanvas(); });

  // ── Boot ──────────────────────────────────────────────────────────────────
  layout();
  sizeCanvas();
  if (document.fonts) document.fonts.load("800 40px Montserrat").then(layout, () => {});
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
